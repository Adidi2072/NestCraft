
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NestCraft</title>
<style>
body {
  margin: 0;
  background: #87ceeb;
  overflow: hidden;
}
canvas {
  display: block;
}
#title {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  font: bold 25px Arial;
  text-shadow: 2px 2px 4px #333;
}
</style>
</head>
<body>

<div id="title">⛏️ NestCraft</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(4, 4, 6);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

const geometry = new THREE.BoxGeometry(1, 1, 1);
const grass = new THREE.MeshStandardMaterial({
  color: 0x55aa33
});
const dirt = new THREE.MeshStandardMaterial({
  color: 0x885533
});

const block = new THREE.Mesh(
  geometry,
  [dirt, dirt, grass, dirt, dirt, dirt]
);
scene.add(block);

function animate() {
  requestAnimationFrame(animate);
  block.rotation.y += 0.005;
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
